<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      background: #f4f4f1;
      color: #171817;
      font-family: Arial, sans-serif;
    "
  >
    <div style="max-width: 520px; margin: 0 auto; padding: 48px 24px">
      <div
        style="
          background: #fff;
          border: 1px solid #dedfd9;
          border-radius: 18px;
          padding: 36px;
        "
      >
        <p style="margin: 0 0 24px; font-size: 18px; font-weight: 700">Runly</p>
        <h1
          style="
            margin: 0 0 12px;
            font-family: Georgia, serif;
            font-size: 32px;
            font-weight: 400;
          "
        >
          Verify your email
        </h1>
        <p style="margin: 0 0 28px; color: #5e615b; line-height: 1.6">
          Enter this six-digit code in Runly to finish creating your account.
        </p>
        <p
          style="
            margin: 0 0 28px;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 10px;
          "
        >
          {{ .Token }}
        </p>
        <p style="margin: 0 0 28px; color: #5e615b; line-height: 1.6">
          You can also
          <a
            href="{{ .SiteURL }}/verify-email?token_hash={{ .TokenHash }}&email={{ .Email }}"
            style="color: #171817; font-weight: 700"
            >open the verification page</a
          >
          for this account.
        </p>
        <p style="margin: 0; color: #777a73; font-size: 13px; line-height: 1.6">
          This code expires in one hour. If you did not create a Runly account,
          you can ignore this email.
        </p>
      </div>
    </div>
  </body>
</html>
